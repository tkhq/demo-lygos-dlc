[workspace]
members = [
  "crates/e2e",
  "crates/metrics",
  "crates/dlc-verify",
]

resolver = "3"

[workspace.package]
edition = "2024"
version = "0.2.0"
publish = false
rust-version = "1.94"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.dependencies]
assert_cmd = "2.0"
axum = { version = "0.8.8", default-features = false }
serde_json = "1.0.142"
serde = { version = "1", default-features = false }
tokio = { version = "1.47", default-features = false }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.6", features = ["trace", "cors"] }
http-body-util = "0.1"
pin-project-lite = "0.2"
prometheus = { version = "0.13", default-features = false }
sha2 = { version = "0.10", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3.23"
qos_core = { version = "0.13.0", default-features = false }
qos_hex = { version = "0.13.0", default-features = false }
qos_json = { version = "0.13.0", default-features = false }
qos_p256 = { version = "0.13.0", default-features = false }
dlc = "0.8.0"
dlc-messages = "0.8.0"
lightning = { version = "0.0.125", default-features = false, features = ["std"] }
bitcoin = { version = "0.32", default-features = false, features = ["std"] }
secp256k1-zkp = { version = "0.11.0", default-features = false, features = ["std", "hashes", "rand", "global-context"] }
thiserror = "2"
