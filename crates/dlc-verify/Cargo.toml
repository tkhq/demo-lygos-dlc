[package]
name = "dlc-verify"
edition.workspace = true
version.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
axum = { workspace = true, features = ["http1", "tokio", "json", "macros", "query"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tower-http = { workspace = true }
reqwest = { workspace = true }
metrics = { path = "../metrics" }
qos_core = { workspace = true }
qos_hex = { workspace = true, features = ["serde"] }
qos_json = { workspace = true }
qos_p256 = { workspace = true }
qos_nsm = { workspace = true }
sha2 = { workspace = true }

# DLC protocol support. `dlc` and `dlc-messages` are the reference Rust implementation;
# `lightning` supplies the wire-format traits they serialize through.
dlc = { workspace = true }
dlc-messages = { workspace = true }
lightning = { workspace = true }
bitcoin = { workspace = true }
secp256k1-zkp = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
http-body-util = { workspace = true }
